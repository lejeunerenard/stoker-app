<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stoker</title>
  <style>
    html {
      background: #fff;
    }
    body > h1:nth-of-type(1) {
      cursor: pointer
    }

    body {
      --title-bar-height: 42px;
      padding-top: var(--title-bar-height);
    }

    #bar {
      background: rgba(55, 60, 72, 0.6);
      backdrop-filter: blur(64px);
      -webkit-app-region: drag;
      height: var(--title-bar-height);
      padding: 0;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      color: #FFF;
      white-space: nowrap;
      box-sizing: border-box;
      position: fixed;
      z-index: 2;
      width: 100%;
      left: 0;
      top: 0;
    }

    #update {
      position: fixed;
      bottom: 12px;
      left: 12px;
      padding: 6px 10px;
      background: #236;
      color: #fff;
      border-radius: 6px;
      z-index: 3;
    }
  </style>
  <script type="module" src="./bundle.js"></script>
</head>
<body>
  <div id="bar"></div>
  <h1>Stoker</h1>
  <canvas></canvas>
  <div id="app"></div>
</body>
</html>
