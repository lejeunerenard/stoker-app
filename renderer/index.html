<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stoker</title>
  <style>
    html {
      background: #fff;
    }
    body > h1:nth-of-type(1) {
      cursor: pointer
    }

    body {
      margin: 0;
      height: 100vh;
      padding: 8px 16px;
      box-sizing: border-box;
    }

    #update {
      position: fixed;
      bottom: 12px;
      left: 12px;
      padding: 6px 10px;
      background: #236;
      color: #fff;
      border-radius: 6px;
      z-index: 3;
    }

    details.menu {
      position: fixed;
      top: 6px;
      right: 10px;
      z-index: 4;
    }
    details.menu > summary {
      display: inline-block;
      width: 32px;
      height: 32px;
      line-height: 32px;
      text-align: center;
      font-size: 18px;
      cursor: pointer;
      list-style: none;
    }
    details.menu > summary::-webkit-details-marker {
      display: none;
    }
    details.menu[open] > summary {
      background: #236;
      color: #fff;
      border-radius: 4px;
    }
    details.menu > .menu-links {
      padding: 6px 10px;
      background: #236;
      color: #fff;
      border-radius: 6px;
    }
    details.menu .menu-links a {
      display: block;
      padding: 4px 8px;
      color: #fff;
      text-decoration: none;
    }
    details.menu .menu-links a:not(:last-child) {
      border-bottom: 1px solid #fff;
    }

    .session-table {
      border-collapse: collapse;
      border: 1px solid #999;
      width: 100%;
      margin: 16px 0;
    }
    .session-table td {
      padding: 4px 8px;
      text-align: left;
      border-top: 1px solid #999;
      border-bottom: 1px solid #999;
    }
    .session-table td:nth-child(2), .session-table td:last-child {
      text-align: right;
    }
    .session-table tr:nth-child(odd) {
      background: #fff;
    }
    .session-table tr:nth-child(even) {
      background: #eee;
    }
    .session-table button {
      border: none;
      background: transparent;
      cursor: pointer;
    }
    .session-table button:hover {
      background: #ddd;
    }
  </style>
  <script type="module" src="./bundle.js"></script>
</head>
<body>
  <h1>Stoker</h1>
  <canvas></canvas>
  <div id="app"></div>
</body>
</html>
